spring:
  application:
    name: chorewars

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:mem:chorewarsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

secret:
  key: ${SECRET_KEY}

